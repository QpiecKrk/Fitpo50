name: Live Post-Push Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live smoke on production
        run: bash scripts/live-postpush-check.sh https://fitpo50.pl

