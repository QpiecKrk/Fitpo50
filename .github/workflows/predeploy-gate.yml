name: Predeploy Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[auto-sync] news status ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate article standard (AEO gate)
        run: npm run article:validate

      - name: Run predeploy gate
        run: node scripts/predeploy-gate.js
