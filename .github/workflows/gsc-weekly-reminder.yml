name: GSC Weekly Reminder

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  gsc_weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate weekly GSC API report
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: npm run gsc:weekly:api

      - name: Open or update weekly reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'SEO/AEO: Poniedziałkowy raport GSC';
            const label = 'seo-gsc-weekly';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const reportPath = 'data/reports/gsc-weekly-report.md';
            const body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'Brak wygenerowanego raportu `data/reports/gsc-weekly-report.md`.';

            const labelsResp = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
            const hasLabel = labelsResp.data.some((l) => l.name === label);
            if (!hasLabel) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '1D76DB',
                description: 'Cotygodniowe przypomnienie i raport GSC',
              });
            }

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 50,
            });

            const existing = openIssues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
            }
