name: GSC Weekly Reminder

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  gsc_weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate weekly GSC API report 
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: npm run gsc:weekly:api 
      - name: Ensure GSC CSV files exist
        run: |
          ls -la data/gsc
          test -f data/gsc/queries.csv
          test -f data/gsc/pages.csv
          test -f data/gsc/query-pages.csv

      - name: Upload GSC CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsc-csv
          path: |
            data/gsc/queries.csv
            data/gsc/pages.csv
            data/gsc/query-pages.csv
          if-no-files-found: error
          retention-days: 14
      - name: Open or update weekly reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'SEO/AEO: Poniedziałkowy raport GSC';
            const label = 'seo-gsc-weekly';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const reportPath = 'data/reports/gsc-weekly-report.md';
            const body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'Brak wygenerowanego raportu `data/reports/gsc-weekly-report.md`.';

            const labelsResp = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
            const hasLabel = labelsResp.data.some((l) => l.name === label);
            if (!hasLabel) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '1D76DB',
                description: 'Cotygodniowe przypomnienie i raport GSC',
              });
            }

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 50,
            });

            const existing = openIssues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Open or update weekly TODO issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const title = 'SEO/AEO: TODO tygodnia (auto)';
            const label = 'seo-gsc-todo';
            const reportPath = 'data/reports/gsc-weekly-report.json';

            const labelsResp = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
            const hasLabel = labelsResp.data.some((l) => l.name === label);
            if (!hasLabel) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '0E8A16',
                description: 'Automatyczna tygodniowa checklista SEO/AEO',
              });
            }

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 50,
            });

            let report = null;
            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            }

            const safe = (v) => String(v || '').trim();
            const opportunities = report?.opportunities || {};
            const top3 = Array.isArray(opportunities.top3_zero_click) ? opportunities.top3_zero_click : [];
            const ctr = Array.isArray(opportunities.ctr_problems) ? opportunities.ctr_problems : [];
            const cannibal = Array.isArray(opportunities.cannibalization) ? opportunities.cannibalization : [];
            const pages = Array.isArray(opportunities.page_opportunities) ? opportunities.page_opportunities : [];

            const tasks = [];
            const status = safe(report?.status) || 'unknown';
            const missingConfig = Array.isArray(report?.missing_config) ? report.missing_config : [];

            if (status !== 'ok') {
              if (missingConfig.length) {
                missingConfig.slice(0, 3).forEach((item) => {
                  tasks.push(`- [ ] ${safe(item)}`);
                });
              }
              while (tasks.length < 3) {
                tasks.push('- [ ] Uruchom workflow GSC ponownie po uzupełnieniu konfiguracji.');
              }
            } else {
              if (top3[0]?.query) {
                tasks.push(`- [ ] Query \`${safe(top3[0].query)}\`: dopisz mocny Quick Answer + popraw title/meta.`);
              }
              if (ctr[0]?.query) {
                tasks.push(`- [ ] Query \`${safe(ctr[0].query)}\`: popraw CTR (title, description, pierwsze 120 znaków intro).`);
              }
              if (cannibal[0]?.query) {
                tasks.push(`- [ ] Kanibalizacja \`${safe(cannibal[0].query)}\`: wybierz 1 URL kanoniczny i wzmocnij linkowanie.`);
              } else if (pages[0]?.page) {
                tasks.push(`- [ ] Strona \`${safe(pages[0].page)}\`: dołóż 2-3 linki wewnętrzne z mocnych podstron.`);
              }
              while (tasks.length < 3) {
                tasks.push('- [ ] Brak mocnych kandydatów: opublikuj 1 nowy artykuł Q&A pod niszowe zapytanie z GSC.');
              }
            }

            const generated = safe(report?.generated_at) || new Date().toISOString();
            const property = safe(report?.property) || 'sc-domain:fitpo50.pl';

            const body = [
              '# TODO tygodnia SEO/AEO (auto)',
              '',
              `Wygenerowano: ${generated}`,
              `Status raportu: ${status}`,
              `Property: ${property}`,
              '',
              '## TOP 3 zadania',
              ...tasks.slice(0, 3),
              '',
              '## Zamknięcie tygodnia',
              '- [ ] Zgłoś indeksację zmienionych URL w GSC.',
              '- [ ] Po 7 dniach porównaj CTR/pozycję w kolejnym raporcie.',
            ].join('\n');

            const existing = openIssues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
            }
