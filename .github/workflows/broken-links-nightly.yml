name: Broken Links Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show checked out commit
        run: |
          git rev-parse HEAD
          git log -1 --oneline

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full build/export + broken links crawl
        run: npm run check:build-export
