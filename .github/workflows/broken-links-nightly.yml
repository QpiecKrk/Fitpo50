name: Broken Links Nightly

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/broken-links-nightly.yml
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full build/export + broken links crawl
        run: npm run check:build-export
