name: FAQ Refresh Report

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  faq_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate FAQ refresh report
        run: node scripts/faq-refresh-report.js

