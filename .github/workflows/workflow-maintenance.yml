name: Workflow Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check workflow health (actions/node versions)
        run: npm run workflow:maintenance
