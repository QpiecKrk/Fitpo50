name: Article Publish Guard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '_site/*.html'
      - 'sitemap.xml'
      - '_site/sitemap.xml'
      - 'llms.txt'
      - '_site/llms.txt'
      - 'assets/pdf/**'
      - '_site/assets/pdf/**'
      - 'scripts/article-publish-guard.js'
      - '.github/workflows/article-publish-guard.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '_site/*.html'
      - 'sitemap.xml'
      - '_site/sitemap.xml'
      - 'llms.txt'
      - '_site/llms.txt'
      - 'assets/pdf/**'
      - '_site/assets/pdf/**'
      - 'scripts/article-publish-guard.js'
      - '.github/workflows/article-publish-guard.yml'

jobs:
  article_guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          HEAD_SHA="${{ github.sha }}"
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
            fi
          fi

          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "changed_files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tr '\n' ' ')"
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run article publish guard
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="${{ steps.changed.outputs.changed_files }}"
          ARGS=()
          for f in $CHANGED; do
            ARGS+=("--changed" "$f")
          done
          npm run article:guard -- "${ARGS[@]}"
