name: Content Freshness Bot

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  freshness_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate content freshness report
        run: npm run content:freshness:report

