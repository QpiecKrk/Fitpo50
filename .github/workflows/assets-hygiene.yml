name: Assets Hygiene

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Retention in days for assets/trash"
        required: false
        default: "14"
      dry_run:
        description: "Dry run only"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cleanup temp files
        run: npm run tmp:cleanup

      - name: Prune assets/trash (manual dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: node scripts/assets-trash-retention.js --days "${{ inputs.days }}" --dry-run --verbose

      - name: Prune assets/trash (apply)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: node scripts/assets-trash-retention.js --days "${{ github.event_name == 'workflow_dispatch' && inputs.days || '14' }}"

      - name: Write assets audit report
        if: ${{ always() }}
        run: node scripts/assets-audit.js --report data/reports/assets-audit.json

      - name: Upload assets hygiene report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: assets-hygiene-report
          path: data/reports/assets-audit.json
          if-no-files-found: warn
